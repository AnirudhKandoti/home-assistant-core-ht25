# Loads default set of integrations.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Include other yaml files
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Logging
logger:
  default: info
  logs:
    homeassistant.components.cloud: debug

#  Google Tasks REST Sensor
sensor:
  - platform: rest
    name: google_tasks
    resource: http://127.0.0.1:8123/local/tasks.json
    method: GET
    timeout: 10
    scan_interval: 60
    value_template: "{{ value_json.count | default(0) }}"
    json_attributes:
      - tasks
      - last_updated

#  Shell Command to run the fetch script
shell_command:
  fetch_google_tasks: "/home/vscode/.local/ha-venv/bin/python3 /workspaces/core/config/fetch_tasks.py"